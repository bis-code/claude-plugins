name: Validate Marketplace

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Check weekly that all plugin repos still exist and are accessible
    - cron: '0 9 * * 1'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate marketplace.json structure
        run: |
          echo "Checking marketplace.json..."
          test -f .claude-plugin/marketplace.json && echo "marketplace.json: OK"

          python3 -c "
          import json, sys
          with open('.claude-plugin/marketplace.json') as f:
              data = json.load(f)
          assert 'name' in data, 'Missing name'
          assert 'plugins' in data, 'Missing plugins'
          assert len(data['plugins']) > 0, 'No plugins listed'
          for p in data['plugins']:
              assert 'name' in p, f'Plugin missing name'
              assert 'source' in p, f'Plugin missing source'
              assert 'repo' in p['source'], f'Plugin missing repo'
              print(f'  {p[\"name\"]}: {p[\"source\"][\"repo\"]} OK')
          print(f'Validated {len(data[\"plugins\"])} plugins')
          "

      - name: Check plugin repos are accessible
        run: |
          python3 -c "
          import json, urllib.request
          with open('.claude-plugin/marketplace.json') as f:
              data = json.load(f)
          for p in data['plugins']:
              repo = p['source']['repo']
              url = f'https://api.github.com/repos/{repo}'
              try:
                  req = urllib.request.Request(url)
                  resp = urllib.request.urlopen(req)
                  print(f'{repo}: accessible (HTTP {resp.status})')
              except Exception as e:
                  print(f'WARNING: {repo} not accessible: {e}')
          "

  install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate the marketplace manifest (strict)
        run: claude plugin validate --strict .claude-plugin/marketplace.json
      - name: Validate each plugin's own manifest (strict)
        # Plugin dirs are validated non-strict: a config repo shipping its own
        # CLAUDE.md at the root draws a strict-mode warning by design (the plugin
        # path does not load it; install.sh does). Errors still fail.
        # A source that cannot be cloned anonymously is a warning, not a
        # failure: it means installs fail for everyone but the owner, which is
        # worth seeing every week without turning the check permanently red.
        run: |
          for repo in $(python3 -c "import json; print(' '.join(p['source']['repo'] for p in json.load(open('.claude-plugin/marketplace.json'))['plugins']))"); do
            dir="$RUNNER_TEMP/${repo//\//_}"
            if git clone -q --depth 1 "https://github.com/$repo" "$dir" 2>/dev/null; then
              claude plugin validate "$dir"
            else
              echo "::warning::$repo is not publicly cloneable — installs fail for anyone but the owner"
            fi
          done
